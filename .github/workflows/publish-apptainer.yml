name: Build and publish images

on:
  release:
    types: [published]

  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to process"
        required: true
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ingenannot-pipeline
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set image tags
        id: tags
        shell: bash
        env:
          TAG: ${{ env.RELEASE_TAG }}
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
        run: |
          set -euo pipefail

          version="${TAG#v}"
          image="${REGISTRY}/${IMAGE_NAME,,}"

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "image=${image}" >> "$GITHUB_OUTPUT"

      - name: Install Apptainer
        uses: eWaterCycle/setup-apptainer@v2
        with:
          apptainer-version: 1.4.5

      - name: Build Apptainer image
        run: |
          chmod +x containers.sh && ./containers.sh && apptainer build container.sif gigacontainer.def

      - name: Log in to GHCR for Apptainer
        run: |
          apptainer registry login \
            --username "${{ github.actor }}" \
            --password "${{ secrets.GITHUB_TOKEN }}" \
            oras://ghcr.io

      - name: Push versioned Apptainer image
        env:
          IMAGE: ${{ steps.tags.outputs.image }}
          VERSION: ${{ steps.tags.outputs.version }}
        run: |
          apptainer push \
            container.sif \
            "oras://${IMAGE}:${VERSION}"

      - name: Push latest Apptainer image
        if: >-
          github.event_name == 'release' &&
          github.event.release.prerelease == false
        env:
          IMAGE: ${{ steps.tags.outputs.image }}
        run: |
          apptainer push \
            container.sif \
            "oras://${IMAGE}:latest"
