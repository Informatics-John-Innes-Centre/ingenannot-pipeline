name: Build and publish images

on:
  release:
    types: [published]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set image tags
        id: tags
        shell: bash
        run: |
          version="${GITHUB_EVENT_RELEASE_TAG_NAME#v}"
          image="${REGISTRY}/${IMAGE_NAME,,}"

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "image=${image}" >> "$GITHUB_OUTPUT"

      #
      # Build and publish the Docker/OCI image
      #

      - name: Log in to GHCR for Docker
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.tags.outputs.image }}:${{ steps.tags.outputs.version }}
            ${{ steps.tags.outputs.image }}:latest
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.tags.outputs.version }}

      #
      # Build and publish the Apptainer SIF image
      #

      - name: Install Apptainer
        uses: eWaterCycle/setup-apptainer@v2
        with:
          version: 1.3.6

      - name: Build Apptainer image
        run: |
          apptainer build container.sif gigacontainer.def

      - name: Log in to GHCR for Apptainer
        run: |
          apptainer registry login \
            --username "${{ github.actor }}" \
            --password "${{ secrets.GITHUB_TOKEN }}" \
            oras://ghcr.io

      - name: Push versioned Apptainer image
        env:
          IMAGE: ${{ steps.tags.outputs.image }}
          VERSION: ${{ steps.tags.outputs.version }}
        run: |
          apptainer push \
            container.sif \
            "oras://${IMAGE}:${VERSION}"

      - name: Push latest Apptainer image
        if: ${{ !github.event.release.prerelease }}
        env:
          IMAGE: ${{ steps.tags.outputs.image }}
        run: |
          apptainer push \
            container.sif \
            "oras://${IMAGE}:latest"
