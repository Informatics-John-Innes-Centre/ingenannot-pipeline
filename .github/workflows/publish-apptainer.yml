name: Build and publish images

on:
  release:
    types: [published]

  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag or commit SHA to process"
        required: true
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ingenannot-pipeline
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_TAG }}

      - name: Set image tags
        id: tags
        shell: bash
        env:
          TAG: ${{ env.RELEASE_TAG }}
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
        run: |
          set -euo pipefail

          version="${TAG#v}"
          image="${REGISTRY}/${IMAGE_NAME,,}"

          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "image=${image}" >> "$GITHUB_OUTPUT"

      - name: Install Apptainer
        uses: eWaterCycle/setup-apptainer@v2
        with:
          apptainer-version: 1.4.5

      - name: Build Apptainer image
        run: |
          chmod +x containers.sh && ./containers.sh && sudo apptainer build container.sif gigacontainer.def