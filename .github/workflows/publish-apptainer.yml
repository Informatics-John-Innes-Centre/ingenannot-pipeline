name: Build and publish images

on:
  release:
    types: [published]

  workflow_dispatch:
    inputs:
      version:
        description: "Version number"
        required: true
        type: string
      ref:
        description: "Branch, tag or SHA to checkout"
        required: true
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ingenannot-pipeline
  CHECKOUT_REF: ${{ github.event.release.tag_name || inputs.ref }}
  RELEASE_TAG: ${{ github.event.release.tag_name || inputs.version }}

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ env.CHECKOUT_REF }}
        
      - name: Set image tags
        id: tags
        shell: bash
        env:
          TAG: ${{ env.RELEASE_TAG }}
          REGISTRY: ${{ env.REGISTRY }}
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
        run: |
          set -euo pipefail
          
          version="${TAG#v}"
          image="${REGISTRY}/informatics-john-innes-centre/${IMAGE_NAME,,}"

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "image=${image}" >> "$GITHUB_OUTPUT"

      - name: Install Apptainer
        uses: eWaterCycle/setup-apptainer@v2
        with:
          apptainer-version: 1.4.5

      - name: Build Apptainer image
        run: |
          chmod +x containers.sh && sudo ./containers.sh && sudo apptainer build container.sif gigacontainer.def

      - name: Log in to GHCR
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_USER: ${{ github.actor }}
        run: |
          printf '%s' "$GH_TOKEN" |
            apptainer registry login \
              --username "$GH_USER" \
              --password-stdin \
              oras://ghcr.io

      - name: Push versioned Apptainer image
        env:
          IMAGE: ${{ steps.tags.outputs.image }}
          VERSION: ${{ steps.tags.outputs.version }}
        run: |
          apptainer push \
            container.sif \
            "oras://${IMAGE}:${VERSION}"

      - name: Push latest Apptainer image
        env:
          IMAGE: ${{ steps.tags.outputs.image }}
        run: |
          apptainer push \
            container.sif \
            "oras://${IMAGE}:latest"
