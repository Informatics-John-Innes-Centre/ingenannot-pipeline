name: Build and publish images

on:
  release:
    types: [published]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set image tags
        id: tags
        shell: bash
        run: |
          version="${GITHUB_EVENT_RELEASE_TAG_NAME#v}"
          image="${REGISTRY}/${IMAGE_NAME,,}"

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "image=${image}" >> "$GITHUB_OUTPUT"

      #
      # Build and publish the Apptainer SIF image
      #

      - name: Install Apptainer
        uses: eWaterCycle/setup-apptainer@v2
        with:
          apptainer-version: 1.4.5

      - name: Build Apptainer image
        run: |
          apptainer build container.sif gigacontainer.def

      - name: Log in to GHCR for Apptainer
        run: |
          apptainer registry login \
            --username "${{ github.actor }}" \
            --password "${{ secrets.GITHUB_TOKEN }}" \
            oras://ghcr.io

      - name: Push versioned Apptainer image
        env:
          IMAGE: ${{ steps.tags.outputs.image }}
          VERSION: ${{ steps.tags.outputs.version }}
        run: |
          apptainer push \
            container.sif \
            "oras://${IMAGE}:${VERSION}"

      - name: Push latest Apptainer image
        if: ${{ !github.event.release.prerelease }}
        env:
          IMAGE: ${{ steps.tags.outputs.image }}
        run: |
          apptainer push \
            container.sif \
            "oras://${IMAGE}:latest"
